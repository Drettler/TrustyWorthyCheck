# Cron job to refresh threat feeds every 6 hours
[[cron_jobs]]
name = "refresh-threat-feeds"
schedule = "0 */6 * * *"
command = "SELECT net.http_post(url := 'https://xpbnmybvddkoujsklqom.supabase.co/functions/v1/fetch-threat-feeds', headers := jsonb_build_object('Content-Type','application/json','x-cron-secret',(select decrypted_secret from vault.decrypted_secrets where name='threat_cron_secret')), body := '{}'::jsonb)"

# Daily recheck of previously filtered/removed sources — only re-adds entries
# that pass the junk and credibility checks.
[[cron_jobs]]
name = "recheck-threat-sources"
schedule = "0 3 * * *"
command = "SELECT net.http_post(url := 'https://xpbnmybvddkoujsklqom.supabase.co/functions/v1/recheck-threat-sources', headers := jsonb_build_object('Content-Type','application/json','x-cron-secret',(select decrypted_secret from vault.decrypted_secrets where name='threat_cron_secret')), body := '{}'::jsonb)"

